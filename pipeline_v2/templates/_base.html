<!DOCTYPE html>
<html lang="en">
<!-- Libraries are served from pipeline_v2/ui_static/vendor (no internet needed). Same top bar, logo and blue as the project's
     own pages (templates/index.html); the pages themselves are white cards on a light background. Served by pipeline_v2.server. -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ReDraft{% endblock %}</title>
  <link rel="stylesheet" href="/ui/vendor/fontawesome/css/all.min.css" />
  <link href="/ui/vendor/bootstrap-4.5.2.min.css" rel="stylesheet" />
  <style>
    :root { --bg: #eef2f7; --card: #fff; --ink: #1f2937; --mute: #6b7280; --line: #e2e8f0; --soft: #f5f7fb;
      --brand: #2d6cb5; --brand-dark: #394058; --ok: #2e9e5b; --warn: #d97706; --bad: #d64545; --info: #0e7c86; }
    html, body { min-height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); }
    /* top bar: dark navy like the Home page, the site icon and name on the left, plain text links, the TCE logo on the right */
    /* stays at the top of the window while the page scrolls (user, 2026-11-23) */
    .topnav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 28px;
              background: #0d1628; border-bottom: 1px solid rgba(148,163,184,.16); }
    .topnav .brand { display: flex; align-items: center; gap: 10px; margin-right: 22px; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.02rem; letter-spacing: .01em; white-space: nowrap; }
    .topnav .brand img { width: 30px; height: 30px; }
    .topnav .brand b { font-weight: 750; letter-spacing: .02em; } .topnav .brand em { font-style: normal; color: #60a5fa; }
    .topnav .brand span { color: #8ea0bf; font-weight: 500; font-size: .78rem; letter-spacing: .04em; padding-left: 10px; margin-left: 2px; border-left: 1px solid rgba(148,163,184,.35); }
    .topnav .links { display: flex; align-items: center; gap: 4px; height: 100%; }
    .topnav .links a { position: relative; display: flex; align-items: center; height: 100%; padding: 0 14px; color: #a9b6cc; text-decoration: none; font-size: .96rem; font-weight: 550; transition: color .15s; }
    .topnav .links a:hover { color: #fff; }
    .topnav .links a::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #60a5fa; transform: scaleX(0); transition: transform .2s; }
    .topnav .links a:hover::after { transform: scaleX(.5); }
    .topnav .links a.active { color: #fff; }
    .topnav .links a.active::after { transform: scaleX(1); }
    .topnav .lg { margin-left: auto; display: flex; align-items: center; }
    .topnav .lg img { height: 42px; width: auto; display: block; }
    .topnav .burger { display: none; margin-left: auto; width: 40px; height: 40px; border: 1px solid rgba(148,163,184,.3); border-radius: 8px; background: transparent; padding: 10px 9px; cursor: pointer; }
    .topnav .burger i { display: block; height: 2px; background: #cbd5e1; border-radius: 2px; margin: 4px 0; }
    @media screen and (max-width: 760px) {
      .topnav { padding: 0 16px; }
      .topnav .lg { display: none; }
      .topnav .burger { display: block; }
      .topnav .links { display: none; position: absolute; top: 60px; left: 0; right: 0; height: auto; flex-direction: column; align-items: stretch; gap: 0;
                       background: #0d1628; border-bottom: 1px solid rgba(148,163,184,.16); padding: 6px 0; }
      .topnav.responsive .links { display: flex; }
      .topnav .links a { height: 46px; padding: 0 20px; }
      .topnav .links a::after { left: 0; right: auto; top: 10px; bottom: 10px; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
    }
    /* page */
    .page { width: 94%; max-width: 1240px; margin: 26px auto 40px; }
    .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .page-head h2 { font-size: 1.45rem; font-weight: 600; margin: 0; }
    .page-head .sub { color: var(--mute); font-size: .9rem; }
    .card-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px rgba(16, 24, 40, .06); padding: 18px 20px; margin-bottom: 18px; }
    .card-box h3 { font-size: 1.05rem; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .card-box h3 i { color: var(--brand); }
    .hint { color: var(--mute); font-size: .85rem; }
    /* buttons */
    .btn-brand { background: var(--brand); color: #fff; border: none; }
    .btn-brand:hover { background: #245a98; color: #fff; }
    .btn-soft { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
    .btn-soft:hover { background: #e9edf5; color: var(--ink); }
    .btn-big { font-size: 1.05rem; padding: .55rem 1.6rem; border-radius: 8px; }
    .btn:disabled { opacity: .55; cursor: default; }
    /* chips and pills */
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
    .chip.ok { background: #e3f5ea; color: #1e7a45; } .chip.run { background: #fff3df; color: #a15c00; }
    .chip.wait { background: #e9edf5; color: #4b5563; } .chip.bad { background: #fde4e4; color: #a32626; }
    .chip.on { background: #e3f5ea; color: #1e7a45; } .chip.off { background: #fde4e4; color: #a32626; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); font-size: .8rem; margin: 2px 4px 2px 0; color: var(--ink); }
    .pill b { font-weight: 700; } .pill.flow { background: #eef4fb; border-color: #cfdcef; }
    /* status */
    .srv { font-size: .85rem; color: var(--mute); }
    .progress-container { position: relative; width: 100%; height: 6px; background-color: #e5e9f0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-bar-run { position: absolute; width: 40%; height: 100%; background: var(--brand); border-radius: 3px; animation: progress-animation 1.6s infinite; }
    @keyframes progress-animation { 0% { left: -40%; } 100% { left: 100%; } }
    .small-log { font-size: .78rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
    /* preview modal */
    html { scroll-padding-top: 60px; }          /* jumps to an anchor land below the top bar */
    #zoomWrap { width: 100%; height: 78vh; overflow: hidden; cursor: grab; background: #fff; }
    #zoomImage { transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
    .modal-dialog.wide { max-width: 94vw; }
    .modal-content { border-radius: 12px; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; color: #1f2937; font-size: .85em; }
  </style>
  <script src="/ui/vendor/jquery-3.5.1.min.js"></script>
  <script src="/ui/vendor/bootstrap-4.5.2.bundle.min.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
  </script>
  {% block head %}{% endblock %}
</head>

<body>
  <nav class="topnav" id="myTopnav">
    <a class="brand" href="/"><img src="/favicon.svg?v=2" alt=""><b>Re<em>Draft</em></b><span>P&amp;ID to layered CAD</span></a>
    <div class="links">
      <a href="/" id="homeLink">Home</a>
      <a href="/upload" id="detectLink">Detect</a>
      <a href="/logs" id="historyLink">History</a>
      <a href="/generate_drawing" id="generateLink">Generate</a>
    </div>
    <div class="lg"><img src="/static/TCE Logo with Tagline-White.png" alt="Tata Consulting Engineers"></div>
    <button class="burger" onclick="myFunction()" aria-label="Menu"><i></i><i></i><i></i></button>
  </nav>

  {% block body %}{% endblock %}

  <script>
    (function () {
      const id = { '/': 'homeLink', '/upload': 'detectLink', '/logs': 'historyLink', '/generate_drawing': 'generateLink' }[location.pathname];
      if (id) document.getElementById(id).classList.add('active');
    })();
    function myFunction() {
      const x = document.getElementById('myTopnav');
      x.classList.toggle('responsive');
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
